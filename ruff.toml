target-version = "py312"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "backend/.venv",
  "backend/uploads",
  "frontend",
  "**/__pycache__",
]

[lint]
# Block genuine errors and undefined names without failing CI on the
# repository's existing stylistic debt.
select = ["E9", "F63", "F7", "F82"]
