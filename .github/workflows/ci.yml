name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, Alembic, pip-audit)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ai_hrms
          MYSQL_USER: hrms_user
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        working-directory: backend
        env:
          ENVIRONMENT: test
          INSTALLED_APPS: hrms,crm,project_management
          SEED_DEMO_DATA: "true"
        run: pytest -q --tb=short -p no:cacheprovider --timeout=60 --durations=25

      - name: Alembic migration round trip on MySQL 8
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: mysql+pymysql://hrms_user:ci-password@127.0.0.1:3306/ai_hrms?charset=utf8mb4
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: pip-audit
        working-directory: backend
        # These two advisories are documented accepted risks in SECURITY.md;
        # ignoring them by ID still fails CI on any newly reported advisory.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln PYSEC-2026-4298

  frontend:
    name: Frontend (npm ci, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=moderate
